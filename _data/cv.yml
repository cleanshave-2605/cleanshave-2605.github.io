    Research Experience:
      - bullet: "**Modelling Popularity Bias in Recommender Systems — M.S.(R) Thesis** | Prof. Arpit Agarwal | February 2025–Present. In collaboration with the Amazon Music team; under review at AAAI 27 (arXiv:2608.10474)."
      - bullet: Formulated a theoretical framework using differential equations to model popularity bias in recommender systems.
      - bullet: Derived and proved concrete theorems using stochastic approximation to predict and quantify user drop-off.
      - bullet: Designed a mitigation solution using equalized odds to prevent popularity bias without loss in system accuracy.
      - bullet: Evaluated the framework using 410 million real-world interactions, validating the predictions and solution.

    Experience:
      - company: Motilal Oswal Financial Services Ltd.
        position: AI Research Intern
        start_date: "2026-05"
        end_date: "2026-08"
        summary: "May–August 2026. Technologies: AWS SageMaker, AWS S3, Databricks, NVIDIA CUDA."
        highlights:
          - Identified recommendation system biases causing 5% of 20,000 catalogue items to absorb 84.5% of interactions.
          - Developed two IPS models to ensure fairness and integrated them using a 35% signal blend across 7,016 users.
          - Achieved a 60% reduction in top 10% popularity concentration, effectively cutting the NDCG@6 cost by half.
          - Developed a dynamic visualisation dashboard using HTML, CSS, and JavaScript to track model performance.
      - company: athenahealth Technology Pvt. Ltd.
        position: Associate Member of Technical Staff
        start_date: "2021-07"
        end_date: "2023-03"
        summary: "July 2021–March 2023. Technologies: Perforce, JIRA, Bitbucket, Kanban workflow."
        highlights:
          - Engineered clean Perl rules code through regression testing, delivering reliable clinical releases for the Rules 1.0 engine.
          - Coordinated cross-functional team updates by resolving JIRA requests and ensuring sprint timelines were followed.
          - Maintained task work orders via internal Wiki pages, enabling strict compliance tracking for project leads.

    Projects:
      - name: Inducing Robustness in 2D-DPO
        start_date: "2025-03"
        end_date: "2025-05"
        summary: "Course project, CS 769 | Prof. Ganesh Ramakrishnan | March–May 2025."
        highlights:
          - Diagnosed a lack of segment-level noise robustness in 2D-DPO, causing a win-rate drop from 43% to 37%.
          - Formulated Robust 2D-DPO and trained a Pythia 6.9B model on 6,400 HelpSteer-2D prompts to test robustness.
          - Increased win rate from 37% to 45% in the presence of noisy labels.
          - Accelerated model training and inference by parallelising over four NVIDIA H100 GPUs.
      - name: Microchess Playing Agent
        start_date: "2025-11"
        end_date: "2025-12"
        summary: "Course project, CS 747 | Prof. Shivaram Kalyankrishnan | November–December 2025."
        highlights:
          - Devised a Microchess agent using reinforcement learning to compete against random and rational opponents.
          - Engineered Negamax with Alpha-Beta pruning and Quiescence search to model gameplay.
          - Achieved 94% and 84% win rates against random and rational opponents respectively across 100 games.
      - name: RLHF under User Heterogeneity
        start_date: "2025-02"
        end_date: "2025-05"
        summary: "Course project, CS6103 | Prof. Arpit Agarwal | February–May 2025."
        highlights:
          - Uncovered a flaw in standard RLHF due to the assumption of perfectly homogeneous preferences across all users.
          - Engineered personalised preference models across 40 workers and two distinct clusters using vector embeddings.
          - Achieved 53% and 52.7% win rates for the two user clusters, compared with a 52% baseline.
      - name: Fine-tuning & Evaluating CNN Backbones
        start_date: "2026-02"
        end_date: "2026-03"
        summary: "Course project, GNR638 | Prof. Biplab Bannerjee | February–March 2026."
        highlights:
          - Benchmarked three pre-trained CNN architectures on the Aerial Image Dataset (AID) with 30 classes.
          - Executed five evaluation paradigms examining few-shot performance and noise robustness across three models.
          - Observed 95% accuracy and a 24% relative drop due to noise for ConvNeXt-Tiny with 27.8 million parameters.
      - name: Blackjack Bot
        start_date: "2025-10"
        end_date: "2025-11"
        summary: "Course project, CS 747 | Prof. Shivaram Kalyankrishnan | October–November 2025."
        highlights:
          - Modelled a 26-card Blackjack variation as a Markov Decision Process with three specific actions.
          - Implemented Linear Programming and Howard's Policy Iteration to solve linear constraints across scenarios.
          - Evaluated optimal value functions against agent actions and passed 100% of defined test cases.
      - name: OCR-based MCQ Solver
        start_date: "2026-04"
        end_date: "2026-05"
        summary: "Course project, GNR638 | Prof. Biplab Bannerjee | April–May 2026."
        highlights:
          - Procured and scraped high-quality MCQ questions on deep learning to train an OCR solver.
          - Trained a Qwen3-VL model with eight billion parameters to extract text using OCR and solve MCQ questions.
          - Attained 90% accuracy using few-shot training on a predefined evaluation dataset.
      - name: Emotion Classification for Hindi
        start_date: "2024-10"
        end_date: "2024-12"
        summary: "Course project, CS 626 | Prof. Pushpak Bhattacharya | October–December 2024."
        highlights:
          - Classified 20,000 Hindi sentences into five distinct emotion classes using deep learning models.
          - Verified 162 scenarios covering nine deep learning models, six dataset variations, and three word-embedding techniques.
          - Attained 84.3% accuracy using TextBlob embeddings and mBERT with human-annotated labels.
      - name: Improved ResNet Implementation
        start_date: "2026-03"
        end_date: "2026-04"
        summary: "Course project, GNR638 | Prof. Biplab Bannerjee | March–April 2026."
        highlights:
          - Addressed information flow obstruction, lossy projection, and suboptimal normalisation in ResNet-50.
          - Implemented iResNet-50 from scratch and trained it for 100 epochs to overcome ResNet-50 bottlenecks.
          - Achieved 85.31% Top-1 accuracy using a 25.56 million parameter iResNet-50 on CIFAR-10 and CIFAR-100.
      - name: Machine Learning over Encrypted Data
        start_date: "2020"
        end_date: "2021"
        summary: Self project | 2020–2021.
        highlights:
          - Identified 250 million medical data breaches and the need for encryption when handling medical data.
          - Developed a Python framework using Homomorphic Encryption to enable operations directly on encrypted data.
          - Performed linear and logistic regression accurately on encrypted data without decryption.

